---
cluster:
  - "bigblue"
form:
  - modules
  - auto_accounts
  - bc_num_hours
  - bc_num_slots
  - num_cores
  - ngpus
  - alloc_mem
  - global_queues
  - bc_vnc_resolution
  - email
attributes:
  modules: 
    widget: "text_field"
    label: "modules to load"
    value: "matlab/R2025a"
    help: |
      Please select modules from "module avail" on the cluster. Use space between each module. For example "matlab/R2024a"
  alloc_mem:
    widget: "number_field"
    label: "Memory (GB)"
    value: 4
    help: "Memory allocated for job up to 1536 GB"
    min: 4
    max: 1536
    step: 4
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    value: 1
    help: |
      Number of cores on node type (4 GB per core unless requesting whole
      node). Leave blank if requesting full node.
    min: 0
    max: 192
    step: 1
  email:
    label: Email Address
    help: |
      Enter your email address if you would like to receive job notifications (start, finished, failed, etc..).  Otherwise, leave the field empty.

      --------------------------
    cacheable: true
    widget: text_field
  ngpus:
    widget: "number_field"
    label: "Number of GPUs"
    value: 0
    help: |
      Number of GPUs in either igpuq or agpuq partitions.
    min: 0
    max: 2
    step: 1
  bc_num_slots: "1"
  bc_vnc_resolution:
    required: true
